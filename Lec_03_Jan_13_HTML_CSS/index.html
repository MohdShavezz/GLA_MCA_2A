<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 20rem;
            height: 20rem;
            background-color: yellow;
            position: relative;
        }

        span {
            width: 5rem;
            height: 5rem;
            background-color: rgb(134, 198, 118);
            position: absolute;
            right: 0;
            bottom: 0;
        }

        @media (min-width: 768px) {
            body {
                background: red;
            }
        }

        div>span>DIV>SPAN {
            color: red;
        }
    </style>
</head>

<body>
    <!-- <h2 style="padding: 4px;margin: 5px;border: 3px solid red;">hello</h2> -->


    <div>
        <span>span 1
            <DIV>
                <SPAN></SPAN>
            </DIV>
        </span>
        <span style="background-color: aqua;">span 4</span>
        <span style="background-color: rgb(168, 168, 215);">span 2</span>
    </div>
</body>

</html>
